<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4B2E83"/>
      <stop offset="100%" stop-color="#2D115C"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5E6C8"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#AA820A"/>
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Outer Shield / Circle with Royal Purple Gradient -->
  <rect width="64" height="64" rx="16" fill="url(#purpleGrad)"/>
  
  <!-- Subtle Inner Gold Border -->
  <rect x="2.5" y="2.5" width="59" height="59" rx="13.5" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.85"/>
  
  <!-- Classical Monogram D with Atelier Hanger Arch -->
  <g filter="url(#subtleShadow)">
    <!-- Hanger Hook Top -->
    <path d="M32 12 C30 12, 28.5 13.5, 28.5 15.5 C28.5 17.5, 30.5 18.5, 32 19.5 L32 21" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Bold Elegant Serif 'D' -->
    <!-- Vertical stem with serifs -->
    <path d="M22 23 L29 23 M25.5 23 L25.5 47 M22 47 L29 47" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="square"/>
    
    <!-- Curved D bowl -->
    <path d="M25.5 24.5 C38 24.5, 43.5 28, 43.5 35 C43.5 42, 38 45.5, 25.5 45.5" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Gold Heritage Dot / Star inside -->
    <circle cx="34" cy="35" r="2.2" fill="url(#goldGrad)"/>
  </g>
</svg>