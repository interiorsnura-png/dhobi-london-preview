<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 56" width="240" height="56">
  <defs>
    <linearGradient id="logoPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4B2E83"/>
      <stop offset="100%" stop-color="#2D115C"/>
    </linearGradient>
    <linearGradient id="logoGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5E6C8"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
    <filter id="logoShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Left Emblem (46x46) -->
  <g transform="translate(5, 5)">
    <!-- Rounded Emblem Background -->
    <rect width="46" height="46" rx="12" fill="url(#logoPurple)"/>
    <rect x="1.5" y="1.5" width="43" height="43" rx="10.5" fill="none" stroke="url(#logoGold)" stroke-width="1.2" stroke-opacity="0.8"/>
    
    <!-- Monogram D and Hanger Motif -->
    <g filter="url(#logoShadow)">
      <!-- Tiny Hook -->
      <path d="M23 8 C21.5 8, 20.5 9, 20.5 10.5 C20.5 12, 22 12.8, 23 13.5 L23 15" fill="none" stroke="url(#logoGold)" stroke-width="1.6" stroke-linecap="round"/>
      
      <!-- Stem with serifs -->
      <path d="M16 16.5 L21 16.5 M18.5 16.5 L18.5 34.5 M16 34.5 L21 34.5" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="square"/>
      
      <!-- Bowl -->
      <path d="M18.5 17.5 C27.5 17.5, 31.5 20, 31.5 25.5 C31.5 31, 27.5 33.5, 18.5 33.5" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"/>
      
      <!-- Gold Diamond Star -->
      <path d="M25 25.5 L26.2 23.5 L27.4 25.5 L26.2 27.5 Z" fill="url(#logoGold)"/>
    </g>
  </g>

  <!-- Typography Right -->
  <g transform="translate(62, 0)">
    <!-- "dhobi" in classic Playfair Display font styling -->
    <text x="0" y="32" font-family="'Playfair Display', Georgia, serif" font-size="28" font-weight="600" fill="#34146C" letter-spacing="-0.02em">dhobi</text>
    
    <!-- "LONDON" in elegant spaced sans -->
    <text x="80" y="27" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#7B7582" letter-spacing="0.22em">LONDON</text>
    
    <!-- Subtitle: "BESPOKE GARMENT ATELIER" -->
    <text x="1" y="47" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="7.5" font-weight="600" fill="#006E2D" letter-spacing="0.14em">BESPOKE GARMENT ATELIER â€¢ SW1</text>
  </g>
</svg>